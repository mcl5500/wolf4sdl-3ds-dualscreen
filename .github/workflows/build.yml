name: Build 3DS Executables

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build 3DSX executable
        run: |
          source /opt/devkitpro/3dsvars.sh
          make clean
          make -j$(nproc)

      - name: Upload 3DSX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolf4sdl-3dsx
          path: |
            wolf4sdl.3dsx
            wolf4sdl.smdh
